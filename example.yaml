# Minimal example: expose the Samsung EHS water law offset (NASA 0x4248)
# as a writable number in Home Assistant.
#
# Only the parts relevant to this component are shown; keep your existing
# esphome / esp32 / wifi / api / uart sections.

external_components:
  # The samsung_ac component that owns the bus. Pin a commit you have tested.
  - source: github://omerfaruk-aran/esphome_samsung_hvac_bus@53b0773ada2fa0d392003dd46d77a8d655deb4ad
    components: [samsung_ac]
  # This repository.
  - source: github://marcoavesani/samsung_hvac_nasa_esphome@main
    components: [samsung_nasa_write]

samsung_ac:
  id: samsung_ac_bus          # needed so samsung_nasa_write can find the bus
  flow_control_pin: GPIO4
  devices:
    - address: "20.00.00"     # hydro unit
      custom_sensor:
        # Read back the offset the unit reports (0.1 °C, signed).
        - name: "Water Law Offset Reported"
          id: water_law_offset_reported
          message: 0x4248
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          accuracy_decimals: 1
          filters:
            - lambda: return (int16_t)x;
            - multiply: 0.1

number:
  - platform: samsung_nasa_write
    name: "Water Law Offset"
    samsung_ac_id: samsung_ac_bus
    address: "20.00.00"       # NASA address of the indoor/hydro unit
    message: 0x4248           # VAR_IN_TEMP_WATER_LAW_TARGET_F (water law offset)
    scale: 10                 # bus value = °C x 10
    min_value: -5
    max_value: 5
    step: 0.5
    state_sensor: water_law_offset_reported   # mirror what the unit reports
    min_write_interval: 30s   # never write more often than this
    mode: box
    unit_of_measurement: "°C"
    device_class: temperature

