# Example: Samsung EHS hydro unit (NASA address 20.00.00).
# Only the parts relevant to this component are shown; keep your existing
# esphome / esp32 / wifi / api / uart sections.

external_components:
  # samsung_ac with the NASA message listener hook (needed for reading values).
  - source: github://marcoavesani/esphome_samsung_hvac_bus@nasa-message-listener
    components: [samsung_ac]
  - source: github://marcoavesani/samsung_hvac_nasa_esphome@main
    components: [samsung_nasa_write]

samsung_ac:
  id: samsung_ac_bus
  flow_control_pin: GPIO4
  devices:
    - address: "20.00.00"
      # Built into samsung_ac: limits the compressor frequency.
      silence_mode:
        name: "Silent Mode"

number:
  # Water law offset: modulate the heat pump without switching it off.
  - platform: samsung_nasa_write
    name: "Water Law Offset"
    address: "20.00.00"
    message: 0x4248
    scale: 10
    min_value: -5
    max_value: 5
    step: 0.5
    min_write_interval: 30s
    mode: box
    unit_of_measurement: "°C"
    device_class: temperature

  # FSV 3043: disinfection start hour (untested; power cycle may be needed).
  - platform: samsung_nasa_write
    name: "Disinfection Start Hour"
    address: "20.00.00"
    message: 0x4269
    data_type: write
    min_value: 0
    max_value: 23
    step: 1
    poll_interval: 1h
    mode: box
    unit_of_measurement: "h"
    entity_category: config

select:
  # FSV 3042: disinfection day (untested; power cycle may be needed).
  - platform: samsung_nasa_write
    name: "Disinfection Day"
    address: "20.00.00"
    message: 0x409A
    data_type: write
    poll_interval: 1h
    entity_category: config
    options:
      0: Sunday
      1: Monday
      2: Tuesday
      3: Wednesday
      4: Thursday
      5: Friday
      6: Saturday
      7: Every day

switch:
  # FSV 3041: disinfection on/off (untested).
  - platform: samsung_nasa_write
    name: "Disinfection"
    address: "20.00.00"
    message: 0x4099
    data_type: write
    poll_interval: 1h
    entity_category: config

sensor:
  # Read an FSV that is never broadcast.
  - platform: samsung_nasa_write
    name: "FSV 3044 Disinfection Target"
    address: "20.00.00"
    message: 0x426A
    scale: 10
    poll_interval: 1h
    unit_of_measurement: "°C"
    entity_category: diagnostic

button:
  - platform: samsung_nasa_write
    name: "Water Law Offset Reset"
    address: "20.00.00"
    message: 0x4248
    value: 0
